name: Publish to PyPI

# Publishes to PyPI on every GitHub Release using Trusted Publishing (OIDC) —
# no API token or secret required. One-time setup: on PyPI add a trusted
# publisher for project "zohomail-free" pointing at owner MelkonTech,
# repo zohomail-free, workflow "publish.yml", environment "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
